name: Send Douyin Messages (Batch Mode)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    # 每天凌晨0点执行第一批
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"
    # 凌晨0点5分执行第二批
    - cron: "5 0 * * *"
      timezone: "Asia/Shanghai"
    # 凌晨0点10分执行第三批
    - cron: "10 0 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  # 所有批次共享同一并发组，确保串行执行
  group: send-douyin-batches
  cancel-in-progress: false

jobs:
  send-batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
      BATCH_ID: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write batch config
        shell: bash
        run: |
          if [ "${BATCH_ID}" = "1" ]; then
            cp config/batches/batch1.json config.json
          elif [ "${BATCH_ID}" = "2" ]; then
            cp config/batches/batch2.json config.json
          else
            cp config/batches/batch3.json config.json
          fi
          echo "Using batch $BATCH_ID config"
      - name: Run batch 1
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-batch1-${{ github.run_id }}
          path: artifacts/
          retention-days: 3

  send-batch2:
    needs: send-batch1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
      BATCH_ID: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write batch config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$DOUYIN_CONFIG" > config.json
          else
            cp config/batches/batch2.json config.json
          fi
      - name: Run batch 2
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-batch2-${{ github.run_id }}
          path: artifacts/
          retention-days: 3

  send-batch3:
    needs: send-batch2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
      BATCH_ID: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write batch config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "$DOUYIN_CONFIG" > config.json
          else
            cp config/batches/batch3.json config.json
          fi
      - name: Run batch 3
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-batch3-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
